# Generates the database password on first apply and stores it in a Secret.
# No password is committed or typed. A rerun finds the Secret and exits, so
# the password survives every later apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumenfx-bot-bootstrap
  namespace: lumenfx-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lumenfx-bot-bootstrap
  namespace: lumenfx-bot
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["lumenfx-bot-postgres"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lumenfx-bot-bootstrap
  namespace: lumenfx-bot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lumenfx-bot-bootstrap
subjects:
  - kind: ServiceAccount
    name: lumenfx-bot-bootstrap
    namespace: lumenfx-bot
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lumenfx-bot-bootstrap-secret
  namespace: lumenfx-bot
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lumenfx-bot
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: lumenfx-bot-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: alpine/k8s:1.32.13
          env:
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - |
              set -eu
              if kubectl get secret lumenfx-bot-postgres >/dev/null 2>&1; then
                echo "lumenfx-bot-postgres already exists, leaving it alone"
                exit 0
              fi
              # Alphanumeric only, so it needs no escaping inside the URL.
              password=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)
              kubectl create secret generic lumenfx-bot-postgres \
                --from-literal=POSTGRES_DB=lumenfx_bot \
                --from-literal=POSTGRES_USER=lumenfx_bot \
                --from-literal=POSTGRES_PASSWORD="$password" \
                --from-literal=DATABASE_URL="postgres://lumenfx_bot:$password@postgres.lumenfx-bot.svc.cluster.local:5432/lumenfx_bot?sslmode=disable"
              echo "created lumenfx-bot-postgres"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
