apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The bot on the registry's microk8s cluster, in its own namespace with its
# own Postgres. Traffic arrives through a Cloudflare tunnel (bot.lumenfx.dev);
# there is no Ingress. Two Secrets are created by hand and never committed,
# in the namespace, which therefore comes first:
#
#   kubectl apply -f deploy/k8s/namespace.yaml
#   kubectl -n lumenfx-bot create secret generic lumenfx-bot-github \
#     --from-literal=GITHUB_APP_ID=<app id> \
#     --from-literal=GITHUB_WEBHOOK_SECRET=<webhook secret> \
#     --from-file=private-key.pem=<path to the App private key>
#   kubectl -n lumenfx-bot create secret generic cloudflare-tunnel \
#     --from-literal=token=<tunnel token>
#   kubectl apply -k deploy/k8s
#
# The database password Secret (lumenfx-bot-postgres) is generated by the
# bootstrap Job on first apply.

namespace: lumenfx-bot

resources:
  - namespace.yaml
  - configmap.yaml
  - bootstrap-secret.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - cloudflared.yaml
  - update-cronjob.yaml
  - backup-cronjob.yaml

# The bot repository's CI pushes :main on every push to main.
images:
  - name: ghcr.io/lumen-fx/bot
    newTag: main

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: lumenfx-bot
