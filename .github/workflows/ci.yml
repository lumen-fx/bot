name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot
          POSTGRES_DB: bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The replay and receiver suites create a database per test here.
      DATABASE_URL: postgres://bot:bot@localhost:5432/bot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: the example config validates
        run: cargo run --locked --bin lumenfx-bot -- check-config examples/lumenfx.toml

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the App manifest is JSON
        run: jq -e '.default_permissions and .default_events' deploy/github-app/manifest.json
      - name: the Kubernetes manifests render
        run: kubectl kustomize deploy/k8s > /dev/null

  image:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build --build-arg REVISION=${{ github.sha }} -t ghcr.io/lumen-fx/bot:main -t ghcr.io/lumen-fx/bot:sha-${{ github.sha }} .
      - name: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/lumen-fx/bot:main
          docker push ghcr.io/lumen-fx/bot:sha-${{ github.sha }}
